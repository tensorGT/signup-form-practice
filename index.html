<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout &amp; Account Form - Accessibility Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-page">
    <header class="form-header">
      <h1>Create your account &amp; order</h1>
      <p>Practicing semantic forms with <code>&lt;fieldset&gt;</code>, custom checkboxes, and keyboard-friendly focus states.</p>
    </header>

    <form class="checkout-form" action="#" method="post">
      <!-- Section 1: Account Info -->
      <fieldset class="form-section">
        <legend>1. Account details</legend>
        <p class="section-hint">Fields marked with <span aria-hidden="true">*</span><span class="sr-only">an asterisk</span> are required.</p>

        <div class="field-grid">
          <div class="field">
            <label for="full-name">Full name <span class="req">*</span></label>
            <input type="text" id="full-name" name="fullName" placeholder="Samira Patel" required autocomplete="name">
          </div>

          <div class="field">
            <label for="email">Email address <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="samira@example.com" required autocomplete="email">
          </div>

          <div class="field">
            <label for="password">Password (min 8 chars) <span class="req">*</span></label>
            <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          </div>

          <div class="field">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="555-014-8821" pattern="[0-9\-\+\s]{7,18}" autocomplete="tel">
          </div>
        </div>
      </fieldset>

      <!-- Section 2: Shipping Address -->
      <fieldset class="form-section">
        <legend>2. Shipping address</legend>

        <div class="field-grid">
          <div class="field full-span">
            <label for="street">Street address <span class="req">*</span></label>
            <input type="text" id="street" name="street" placeholder="412 Maple Ave, Apt 3B" required autocomplete="street-address">
          </div>

          <div class="field">
            <label for="city">City <span class="req">*</span></label>
            <input type="text" id="city" name="city" placeholder="Portland" required autocomplete="address-level2">
          </div>

          <div class="field">
            <label for="postal">Postal code <span class="req">*</span></label>
            <input type="text" id="postal" name="postal" placeholder="97205" pattern="[A-Za-z0-9\-\s]{3,10}" required autocomplete="postal-code">
          </div>
        </div>
      </fieldset>

      <!-- Section 3: Delivery speed (custom radio buttons) -->
      <fieldset class="form-section">
        <legend>3. Delivery speed</legend>
